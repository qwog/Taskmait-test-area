<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Spend Optimizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>SaaS Spend Optimizer</h1>
      <p class="subtitle">Enter your tools and get a quick overpayment assessment.</p>

      <section class="card">
        <h2>Tools</h2>
        <div class="table-wrap">
          <table id="toolsTable">
            <thead>
              <tr>
                <th>Tool</th>
                <th>Category</th>
                <th>Seats</th>
                <th>Cost / User ($)</th>
                <th>Term</th>
                <th>Usage</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="toolRows"></tbody>
          </table>
        </div>
        <button id="addToolBtn" class="btn">+ Add Tool</button>
      </section>

      <section class="card actions">
        <button id="assessBtn" class="btn primary">Run Assessment</button>
      </section>

      <section class="card" id="results" hidden>
        <h2>Assessment</h2>
        <div class="metrics">
          <div><strong>Total Monthly:</strong> <span id="totalMonthly"></span></div>
          <div><strong>Total Annualized:</strong> <span id="totalAnnual"></span></div>
        </div>
        <h3>Findings</h3>
        <ul id="findings"></ul>
        <h3>Recommendations</h3>
        <ul id="recommendations"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
